name: Synapse Manager

on:
  push:
    branches: [main]
    paths:
      - "synapse_manager/**"
  pull_request:
    paths:
      - "synapse_manager/**"

# Stop obsolete validation runs when a newer commit arrives.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Format + Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Prepare audited TLS trust
        working-directory: ${{ github.workspace }}
        shell: bash
        run: python image_builder/payload/tls_policy.py bundle --output "$RUNNER_TEMP/synapse-ca.pem" --github-env

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        env:
          NODE_OPTIONS: --use-openssl-ca
        with:
          components: rustfmt

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        env:
          NODE_OPTIONS: --use-openssl-ca
        with:
          workspaces: synapse_manager/src-tauri

      - name: Rust fmt check
        working-directory: synapse_manager/src-tauri
        run: cargo fmt --all -- --check

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        env:
          NODE_OPTIONS: --use-openssl-ca
        with:
          bun-version: "1.4.4"

      - name: Verify Bun certificate distrust
        working-directory: ${{ github.workspace }}
        run: bun image_builder/check_runtime.ts

      - name: Install frontend deps
        working-directory: synapse_manager
        run: bun install --frozen-lockfile

      - name: Prettier check
        working-directory: synapse_manager
        run: bunx --bun prettier . --check

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v6

      - name: Prepare audited TLS trust
        working-directory: ${{ github.workspace }}
        shell: bash
        run: python image_builder/payload/tls_policy.py bundle --output "$RUNNER_TEMP/synapse-ca.pem" --github-env

      - name: Install Linux dependencies (Tauri)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            pkg-config \
            build-essential

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        env:
          NODE_OPTIONS: --use-openssl-ca

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        env:
          NODE_OPTIONS: --use-openssl-ca
        with:
          workspaces: synapse_manager/src-tauri

      - name: Build Rust backend
        working-directory: synapse_manager/src-tauri
        run: cargo build --release

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        env:
          NODE_OPTIONS: --use-openssl-ca
        with:
          bun-version: "1.4.4"

      - name: Verify Bun certificate distrust
        working-directory: ${{ github.workspace }}
        run: bun image_builder/check_runtime.ts

      - name: Install frontend deps
        working-directory: synapse_manager
        run: bun install --frozen-lockfile

      - name: Build frontend
        working-directory: synapse_manager
        run: bun run build
