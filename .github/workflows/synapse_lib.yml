name: Synapse Lib

on:
  push:
    branches: [main]
    paths:
      - "synapse_lib/src/**"
      - "synapse_lib/schema/**"
      - "synapse_lib/tools/**"
      - "synapse_lib/*.gradle"
      - "versions.properties"
  pull_request:
    paths:
      - "synapse_lib/src/**"
      - "synapse_lib/schema/**"
      - "synapse_lib/tools/**"
      - "synapse_lib/*.gradle"
      - "versions.properties"

permissions:
  contents: read
  pull-requests: write

# Stop obsolete validation runs when a newer commit arrives.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Prepare audited TLS trust
        working-directory: ${{ github.workspace }}
        shell: bash
        run: python image_builder/payload/tls_policy.py bundle --output "$RUNNER_TEMP/synapse-ca.pem" --github-env

      - name: Cache Gradle packages
        uses: actions/cache@v5
        env:
          NODE_OPTIONS: --use-openssl-ca
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle', '**/gradle.lockfile', 'versions.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        env:
          NODE_OPTIONS: --use-openssl-ca
        with:
          check-latest: true
          distribution: "temurin"
          java-version: "25"

      - name: Verify JDK certificate distrust
        working-directory: ${{ github.workspace }}
        run: python image_builder/payload/tls_policy.py java

      - name: Build Project
        run: |
          cd synapse_lib
          ./gradlew build

  systemcore-cross-build:
    runs-on: ubuntu-latest
    container: wpilib/systemcore-cross-ubuntu:2027-24.04
    env:
      GRADLE_USER_HOME: /github/home/.gradle

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Prepare audited TLS trust
        working-directory: ${{ github.workspace }}
        shell: bash
        run: python image_builder/payload/tls_policy.py bundle --output "$RUNNER_TEMP/synapse-ca.pem" --github-env

      - name: Cache Gradle packages
        uses: actions/cache@v5
        env:
          NODE_OPTIONS: --use-openssl-ca
        with:
          path: ~/.gradle
          key: systemcore-cross-gradle-${{ hashFiles('versions.properties', 'synapse_lib/*.gradle', 'examples/*.gradle') }}
          restore-keys: |
            systemcore-cross-gradle-

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        env:
          NODE_OPTIONS: --use-openssl-ca
        with:
          check-latest: true
          distribution: "temurin"
          java-version: "25"

      - name: Verify JDK certificate distrust
        working-directory: ${{ github.workspace }}
        run: python image_builder/payload/tls_policy.py java

      - name: Build for SystemCore
        run: |
          cd synapse_lib
          ./gradlew build

  test:
    needs: build
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Prepare audited TLS trust
        working-directory: ${{ github.workspace }}
        shell: bash
        run: python image_builder/payload/tls_policy.py bundle --output "$RUNNER_TEMP/synapse-ca.pem" --github-env

      - name: Cache Gradle packages
        uses: actions/cache@v5
        env:
          NODE_OPTIONS: --use-openssl-ca
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle', '**/gradle.lockfile', 'versions.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        env:
          NODE_OPTIONS: --use-openssl-ca
        with:
          check-latest: true
          distribution: "temurin"
          java-version: "25"

      - name: Verify JDK certificate distrust
        working-directory: ${{ github.workspace }}
        run: python image_builder/payload/tls_policy.py java

      - name: Run Tests
        run: |
          cd synapse_lib
          ./gradlew test

  spotless-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Prepare audited TLS trust
        working-directory: ${{ github.workspace }}
        shell: bash
        run: python image_builder/payload/tls_policy.py bundle --output "$RUNNER_TEMP/synapse-ca.pem" --github-env

      - name: Cache Gradle packages
        uses: actions/cache@v5
        env:
          NODE_OPTIONS: --use-openssl-ca
        with:
          path: ~/.gradle/caches
          key: ubuntu-latest-gradle-${{ hashFiles('**/*.gradle', '**/gradle.lockfile', 'versions.properties') }}
          restore-keys: |
            ubuntu-latest-gradle-

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        env:
          NODE_OPTIONS: --use-openssl-ca
        with:
          check-latest: true
          distribution: "temurin"
          java-version: "25"

      - name: Verify JDK certificate distrust
        working-directory: ${{ github.workspace }}
        run: python image_builder/payload/tls_policy.py java

      - name: Run Spotless Check
        run: |
          cd synapse_lib
          ./gradlew spotlessCheck
