name: Synapse Networking

on:
  push:
    branches:
      - main
    paths:
      - "**/*.proto"
      - "synapse_net/proto/buf.yaml"
      - "synapse_net/proto/buf.gen.yaml"
  pull_request:
    paths:
      - "**/*.proto"
      - "synapse_net/proto/buf.yaml"
      - "synapse_net/proto/buf.gen.yaml"

jobs:
  protobuf:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10.7"

      - name: Install Buf CLI
        uses: bufbuild/buf-action@v1
        with:
          setup_only: true
          version: "1.50.0"
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check Buf version
        run: buf --version

      - name: Check protobuf format
        run: buf format --diff
        working-directory: synapse_net/proto

      - name: Lint protobuf files
        run: buf lint
        working-directory: synapse_net/proto

      - name: Build protobuf files
        run: buf build
        working-directory: synapse_net/proto
