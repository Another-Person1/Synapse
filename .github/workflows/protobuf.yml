name: Synapse Networking

on:
  push:
    branches:
      - main
    paths:
      - "**/*.proto"
      - "synapse_net/proto/buf.yaml"
      - "synapse_net/proto/buf.gen.yaml"
  pull_request:
    paths:
      - "**/*.proto"
      - "synapse_net/proto/buf.yaml"
      - "synapse_net/proto/buf.gen.yaml"

# Stop obsolete validation runs when a newer commit arrives.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  protobuf:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v6

      - name: Prepare audited TLS trust
        working-directory: ${{ github.workspace }}
        shell: bash
        run: python image_builder/payload/tls_policy.py bundle --output "$RUNNER_TEMP/synapse-ca.pem" --github-env

      - name: Set up Python
        uses: actions/setup-python@v6
        env:
          NODE_OPTIONS: --use-openssl-ca
        with:
          check-latest: true
          python-version: "3.12"

      - name: Update and audit Python TLS tooling
        working-directory: ${{ github.workspace }}
        run: |
          python image_builder/payload/tls_policy.py bootstrap
          python image_builder/payload/tls_policy.py audit

      - name: Install Buf CLI
        uses: bufbuild/buf-action@v1
        env:
          NODE_OPTIONS: --use-openssl-ca
        with:
          setup_only: true
          version: "1.50.0"
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check Buf version
        run: buf --version

      - name: Check protobuf format
        run: buf format --diff
        working-directory: synapse_net/proto

      - name: Lint protobuf files
        run: buf lint
        working-directory: synapse_net/proto

      - name: Build protobuf files
        run: buf build
        working-directory: synapse_net/proto
