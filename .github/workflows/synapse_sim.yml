name: Synapse Sim

on:
  push:
    branches: [main]
    paths:
      - "synapse_sim/**"
      - "setup.py"
      - "MANIFEST.in"
      - ".github/workflows/synapse_sim.yml"
  pull_request:
    paths:
      - "synapse_sim/**"
      - "setup.py"
      - "MANIFEST.in"
      - ".github/workflows/synapse_sim.yml"

# Stop obsolete validation runs when a newer commit arrives.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: synapse_sim

    steps:
      - uses: actions/checkout@v6

      - name: Prepare audited TLS trust
        working-directory: ${{ github.workspace }}
        shell: bash
        run: python image_builder/payload/tls_policy.py bundle --output "$RUNNER_TEMP/synapse-ca.pem" --github-env

      - uses: oven-sh/setup-bun@v2
        env:
          NODE_OPTIONS: --use-openssl-ca
        with:
          bun-version: "1.4.4"

      - name: Verify Bun certificate distrust
        working-directory: ${{ github.workspace }}
        run: bun image_builder/check_runtime.ts

      - name: Install Bun dependencies
        run: bun install --frozen-lockfile

      - name: Build interactive viewer
        run: bun run build

      - name: Build headless simulator renderer
        run: bun run build:headless

      - name: Verify committed simulator renderer bundle
        working-directory: .
        run: |
          git diff --exit-code -- \
            synapse_sim/src/synapse_sim/assets/viewer.bundle.js \
            synapse_sim/src/synapse_sim/assets/index.html

  test:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Prepare audited TLS trust
        working-directory: ${{ github.workspace }}
        shell: bash
        run: python image_builder/payload/tls_policy.py bundle --output "$RUNNER_TEMP/synapse-ca.pem" --github-env

      - uses: actions/setup-python@v6
        env:
          NODE_OPTIONS: --use-openssl-ca
        with:
          check-latest: true
          python-version: "3.12"
          cache: pip

      - name: Update and audit Python TLS tooling
        working-directory: ${{ github.workspace }}
        run: |
          python image_builder/payload/tls_policy.py bootstrap
          python image_builder/payload/tls_policy.py audit

      - name: Install Synapse
        run: pip install ".[dev]"

      - name: Install current official stable Chrome
        working-directory: ${{ github.workspace }}
        shell: bash
        run: python -m image_builder.setup_browser --output "$RUNNER_TEMP/synapse-chrome" --github-env

      - name: Check Chrome
        run: '"$SYNAPSE_CHROME" --version'

      - name: Verify headless camera rendering
        env:
          SYNAPSE_TEST_SIM_BROWSER: "1"
          # GitHub runners have no GPU, so render through SwiftShader.
          SYNAPSE_SIM_ANGLE: swiftshader
        run: pytest synapse_sim/tests -q
