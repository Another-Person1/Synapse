name: Publish Synapse to PyPI

on:
  push:
    tags:
      - "v*" # Trigger on tags like v1.0.0
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Prepare audited TLS trust
        working-directory: ${{ github.workspace }}
        shell: bash
        run: python image_builder/payload/tls_policy.py bundle --output "$RUNNER_TEMP/synapse-ca.pem" --github-env

      - name: Set up Python
        uses: actions/setup-python@v6
        env:
          NODE_OPTIONS: --use-openssl-ca
        with:
          check-latest: true
          python-version: "3.12"

      - name: Update and audit Python TLS tooling
        working-directory: ${{ github.workspace }}
        run: |
          python image_builder/payload/tls_policy.py bootstrap
          python image_builder/payload/tls_policy.py audit

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        env:
          NODE_OPTIONS: --use-openssl-ca
        with:
          bun-version: "1.4.4"

      - name: Verify Bun certificate distrust
        working-directory: ${{ github.workspace }}
        run: bun image_builder/check_runtime.ts

      - name: Install Bun dependencies
        working-directory: synapse_ui
        run: bun install --frozen-lockfile

      - name: Install simulator Bun dependencies
        working-directory: synapse_sim
        run: bun install --frozen-lockfile

      - name: Verify committed simulator renderer bundle
        run: |
          (cd synapse_sim && bun run build:headless)
          git diff --exit-code -- \
            synapse_sim/src/synapse_sim/assets/viewer.bundle.js \
            synapse_sim/src/synapse_sim/assets/index.html

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install setuptools wheel twine

      - name: Build package
        run: make build

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: python -m twine upload dist/*
