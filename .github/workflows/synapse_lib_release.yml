name: SynapseLib Release

on:
  workflow_dispatch:
    inputs:
      releaseVersion:
        description: "Release version number"
        type: string
        required: true
      forceDev:
        description: "Force pubVersion=dev"
        type: boolean
        default: false

  workflow_call:
    inputs:
      releaseVersion:
        type: string
        required: true
      forceDev:
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    permissions:
      contents: write
      actions: read
      pages: write
      deployments: read
      id-token: write

    env:
      releaseVersion: ${{ inputs.releaseVersion }}
      workingDirectory: ${{ github.workspace }}/synapse_lib

    steps:
      - name: Configure git user
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Prepare audited TLS trust
        working-directory: ${{ github.workspace }}
        shell: bash
        run: python image_builder/payload/tls_policy.py bundle --output "$RUNNER_TEMP/synapse-ca.pem" --github-env

      - name: Cache Gradle packages
        uses: actions/cache@v5
        env:
          NODE_OPTIONS: --use-openssl-ca
        with:
          path: ~/.gradle
          key: synapselib-release-gradle-${{ hashFiles('versions.properties', 'synapse_lib/*.gradle', 'examples/*.gradle') }}
          restore-keys: |
            synapselib-release-gradle-

      - name: Set release version
        run: |
          sed -i "s/^synapseVersion=.*/synapseVersion=${{ inputs.releaseVersion }}/" versions.properties
          echo "Set synapseVersion=${{ inputs.releaseVersion }}"

      - name: Force dev version
        if: ${{ inputs.forceDev }}
        run: |
          sed -i 's/^synapseVersion=.*/synapseVersion=dev/' versions.properties
          echo "Forced synapseVersion=dev"

      - name: Set up Java
        uses: actions/setup-java@v5
        env:
          NODE_OPTIONS: --use-openssl-ca
        with:
          check-latest: true
          distribution: temurin
          java-version: 25

      - name: Verify JDK certificate distrust
        working-directory: ${{ github.workspace }}
        run: python image_builder/payload/tls_policy.py java

      - name: Make gradlew executable
        run: chmod +x gradlew
        working-directory: ${{ env.workingDirectory }}

      - name: Install SystemCore toolchain
        run: ./gradlew installSystemCoreToolchain
        working-directory: ${{ env.workingDirectory }}

      - name: Build synapse_lib
        run: ./gradlew build
        working-directory: ${{ env.workingDirectory }}

      - name: Checkout gh-pages branch
        uses: actions/checkout@v6
        env:
          NODE_OPTIONS: --use-openssl-ca
        with:
          ref: gh-pages
          path: ${{ env.workingDirectory }}/vendordep/

      - name: Prepare audited TLS trust
        working-directory: ${{ github.workspace }}
        shell: bash
        run: python image_builder/payload/tls_policy.py bundle --output "$RUNNER_TEMP/synapse-ca.pem" --github-env

      - name: Gradle Publish
        run: ./gradlew publish
        working-directory: ${{ env.workingDirectory }}

      - name: Create versioned vendor JSON
        run: |
          cp SynapseLib.json SynapseLib-${{ inputs.releaseVersion }}.json
        working-directory: ${{ env.workingDirectory }}/vendordep/

      - name: Commit and push gh-pages updates
        run: |
          git add .
          git commit -m "Automatically add SynapseLib version ${{ inputs.releaseVersion }}"
          git push
        working-directory: ${{ env.workingDirectory }}/vendordep/

      - name: Setup Pages
        uses: actions/configure-pages@v6
        env:
          NODE_OPTIONS: --use-openssl-ca

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        env:
          NODE_OPTIONS: --use-openssl-ca
        with:
          name: github-pages
          retention-days: 90
          path: ${{ env.workingDirectory }}/vendordep/

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5
        env:
          NODE_OPTIONS: --use-openssl-ca

      - name: Output Pages Tree
        run: find ${{ env.workingDirectory }}/vendordep/ -type f
