name: Synapse UI

on:
  push:
    branches: [main]
    paths:
      - "synapse_ui/**"
  pull_request:
    paths:
      - "synapse_ui/**"

# Stop obsolete validation runs when a newer commit arrives.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: synapse_ui
    steps:
      - uses: actions/checkout@v6

      - name: Prepare audited TLS trust
        working-directory: ${{ github.workspace }}
        shell: bash
        run: python image_builder/payload/tls_policy.py bundle --output "$RUNNER_TEMP/synapse-ca.pem" --github-env

      - uses: oven-sh/setup-bun@v2
        env:
          NODE_OPTIONS: --use-openssl-ca
        with:
          bun-version: "1.4.4"

      - name: Verify Bun certificate distrust
        working-directory: ${{ github.workspace }}
        run: bun image_builder/check_runtime.ts

      - name: Cache Bun + Next.js
        uses: actions/cache@v5
        env:
          NODE_OPTIONS: --use-openssl-ca
        with:
          path: |
            ~/.bun/install/cache
            synapse_ui/node_modules
            synapse_ui/.next/cache
          key: ubuntu-bun-1.4.4-${{ hashFiles('synapse_ui/bun.lock') }}
          restore-keys: |
            ubuntu-bun-1.4.4-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: bun run build

  test:
    needs: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: synapse_ui
    steps:
      - uses: actions/checkout@v6

      - name: Prepare audited TLS trust
        working-directory: ${{ github.workspace }}
        shell: bash
        run: python image_builder/payload/tls_policy.py bundle --output "$RUNNER_TEMP/synapse-ca.pem" --github-env

      - uses: oven-sh/setup-bun@v2
        env:
          NODE_OPTIONS: --use-openssl-ca
        with:
          bun-version: "1.4.4"

      - name: Verify Bun certificate distrust
        working-directory: ${{ github.workspace }}
        run: bun image_builder/check_runtime.ts

      - name: Cache Bun + Next.js
        uses: actions/cache@v5
        env:
          NODE_OPTIONS: --use-openssl-ca
        with:
          path: |
            ~/.bun/install/cache
            synapse_ui/node_modules
            synapse_ui/.next/cache
          key: ubuntu-bun-1.4.4-${{ hashFiles('synapse_ui/bun.lock') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test

  format:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: synapse_ui
    steps:
      - uses: actions/checkout@v6

      - name: Prepare audited TLS trust
        working-directory: ${{ github.workspace }}
        shell: bash
        run: python image_builder/payload/tls_policy.py bundle --output "$RUNNER_TEMP/synapse-ca.pem" --github-env

      - uses: oven-sh/setup-bun@v2
        env:
          NODE_OPTIONS: --use-openssl-ca
        with:
          bun-version: "1.4.4"

      - name: Verify Bun certificate distrust
        working-directory: ${{ github.workspace }}
        run: bun image_builder/check_runtime.ts

      - name: Cache Bun + Next.js
        uses: actions/cache@v5
        env:
          NODE_OPTIONS: --use-openssl-ca
        with:
          path: |
            ~/.bun/install/cache
            synapse_ui/node_modules
            synapse_ui/.next/cache
          key: ubuntu-bun-1.4.4-${{ hashFiles('synapse_ui/bun.lock') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Prettier check
        run: bunx --bun prettier --check .

      - name: Run lint
        run: bun run lint
