name: "Pull Request Labeler"
on:
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: Pull request to label
        type: number
        required: true

jobs:
  triage:
    permissions:
      contents: read
      pull-requests: write
      issues: write        
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - uses: actions/labeler@v6
        with:
          sync-labels: true
          pr-number: ${{ inputs.pull_request_number }}
