name: "Pull Request Labeler"
on:
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: Pull request to label
        type: number
        required: true

jobs:
  triage:
    permissions:
      contents: read
      pull-requests: write
      issues: write        
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Prepare audited TLS trust
        working-directory: ${{ github.workspace }}
        shell: bash
        run: python image_builder/payload/tls_policy.py bundle --output "$RUNNER_TEMP/synapse-ca.pem" --github-env

      - uses: actions/labeler@v6
        env:
          NODE_OPTIONS: --use-openssl-ca
        with:
          sync-labels: true
          pr-number: ${{ inputs.pull_request_number }}
