name: SynapseLib Examples

on:
  push:
    branches: [main]
    paths:
      - "examples/**"
      - "versions.properties"
  pull_request:
    paths:
      - "examples/**"
      - "versions.properties"

# Stop obsolete validation runs when a newer commit arrives.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build_robot_example:
    name: Build Robot - ${{ matrix.example }}
    runs-on: ubuntu-22.04
    container: wpilib/systemcore-cross-ubuntu:2027-24.04
    strategy:
      matrix:
        example: [aimAtTarget]
    steps:
      - uses: actions/checkout@v6

      - name: Prepare audited TLS trust
        working-directory: ${{ github.workspace }}
        shell: bash
        run: python image_builder/payload/tls_policy.py bundle --output "$RUNNER_TEMP/synapse-ca.pem" --github-env

      - name: Add repository to git safe directories
        run: git config --global --add safe.directory $GITHUB_WORKSPACE

      - name: Set up Java (with Gradle cache)
        uses: actions/setup-java@v5
        env:
          NODE_OPTIONS: --use-openssl-ca
        with:
          check-latest: true
          distribution: temurin
          java-version: 25
          cache: gradle

      - name: Verify JDK certificate distrust
        working-directory: ${{ github.workspace }}
        run: python image_builder/payload/tls_policy.py java

      - name: Grant execute permission for gradlew
        working-directory: examples
        run: chmod +x gradlew

      - name: Build with example
        working-directory: examples
        run: ./gradlew build -x spotlessCheck -Pexample=${{ matrix.example }}

      - name: Spotless Check
        working-directory: examples
        run: ./gradlew spotlessCheck

  build_synapse:
    name: "Build Synapse Processor - ${{ matrix.example }}"
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        example: [synapseproject, bullseye_project]
    steps:
      - uses: actions/checkout@v6

      - name: Prepare audited TLS trust
        working-directory: ${{ github.workspace }}
        shell: bash
        run: python image_builder/payload/tls_policy.py bundle --output "$RUNNER_TEMP/synapse-ca.pem" --github-env

      - name: Set up Python
        uses: actions/setup-python@v6
        env:
          NODE_OPTIONS: --use-openssl-ca
        with:
          check-latest: true
          cache: pip
          python-version: "3.12"

      - name: Update and audit Python TLS tooling
        working-directory: ${{ github.workspace }}
        run: |
          python image_builder/payload/tls_policy.py bootstrap
          python image_builder/payload/tls_policy.py audit

      - name: Install SynapseFRC from repo
        run: pip install .

      - name: Install tools
        run: pip install pyright ruff==0.15.20

      - name: Type-check Synapse project
        working-directory: examples/${{ matrix.example }}
        run: pyright .

      - name: Ruff Lint Synapse project
        working-directory: examples/${{ matrix.example }}
        run: ruff check .
