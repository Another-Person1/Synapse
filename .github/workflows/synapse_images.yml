name: Synapse Linux images

on:
  pull_request:
    paths:
      - image_builder/**
      - .github/workflows/synapse_images.yml
  push:
    branches: [main, codex/synapse-image-builder]
    tags: ["v*"]
    paths:
      - image_builder/**
      - .github/workflows/synapse_images.yml
      - synapse_core/**
      - synapse_net/**
      - synapse_installer/**
      - synapse_ui/**
      - synapse_sim/src/**
      - setup.py
      - MANIFEST.in
      - pyproject.toml
      - versions.properties
      - .bun-version
  workflow_dispatch:
    inputs:
      board:
        description: Board to build (all builds every supported board)
        type: choice
        options: [all, raspberrypi, radxa-dragon-q6a, orangepi5, orangepi5-plus]
        default: all
        required: true

permissions:
  contents: read

concurrency:
  group: synapse-images-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Prepare audited TLS trust
        working-directory: ${{ github.workspace }}
        shell: bash
        run: python image_builder/payload/tls_policy.py bundle --output "$RUNNER_TEMP/synapse-ca.pem" --github-env

      - uses: actions/setup-python@v6
        env:
          NODE_OPTIONS: --use-openssl-ca
        with:
          check-latest: true
          python-version: '3.12'
      - name: Update and audit Python TLS tooling
        working-directory: ${{ github.workspace }}
        run: |
          python image_builder/payload/tls_policy.py bootstrap
          python image_builder/payload/tls_policy.py audit

      - run: python -m pip install pytest
      - run: sudo apt-get update && sudo apt-get install --yes shellcheck gnupg device-tree-compiler
      - run: python -m pytest image_builder/tests -q
      - name: Verify project permissions as an unprivileged runtime user
        run: sudo "$(command -v python)" -m unittest image_builder.tests.test_project_permissions -v
      - run: shellcheck image_builder/*.sh image_builder/payload/*.sh image_builder/payload/synapse-firstboot image_builder/payload/synapse-usb-ethernet image_builder/payload/synapse-pwm-permissions

  matrix:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    outputs:
      boards: ${{ steps.select.outputs.boards }}
    steps:
      - uses: actions/checkout@v6
      - name: Prepare audited TLS trust
        working-directory: ${{ github.workspace }}
        shell: bash
        run: python image_builder/payload/tls_policy.py bundle --output "$RUNNER_TEMP/synapse-ca.pem" --github-env

      - id: select
        env:
          SELECTED_BOARD: ${{ inputs.board || 'all' }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          from image_builder.build import image_targets
          print('boards=' + json.dumps(image_targets(os.environ['SELECTED_BOARD'])))
          PY

  wheel:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Prepare audited TLS trust
        working-directory: ${{ github.workspace }}
        shell: bash
        run: python image_builder/payload/tls_policy.py bundle --output "$RUNNER_TEMP/synapse-ca.pem" --github-env

      - uses: actions/setup-python@v6
        env:
          NODE_OPTIONS: --use-openssl-ca
        with:
          check-latest: true
          python-version: '3.12'
      - name: Update and audit Python TLS tooling
        working-directory: ${{ github.workspace }}
        run: |
          python image_builder/payload/tls_policy.py bootstrap
          python image_builder/payload/tls_policy.py audit

      - uses: oven-sh/setup-bun@v2
        env:
          NODE_OPTIONS: --use-openssl-ca
        with:
          bun-version: "1.4.4"
      - name: Verify Bun certificate distrust
        working-directory: ${{ github.workspace }}
        run: bun image_builder/check_runtime.ts

      - run: python -m pip install build
      - run: bash image_builder/build-wheel.sh
      - uses: actions/upload-artifact@v7
        env:
          NODE_OPTIONS: --use-openssl-ca
        with:
          name: synapse-image-wheel
          path: dist/image-builder/*.whl
          if-no-files-found: error
      - name: Pre-download ARM64 wheels for offline image installs
        run: |
          python -m pip download --dest dist/wheelhouse \
            --platform manylinux2014_aarch64 --platform linux_aarch64 \
            --python-version 3.12 --implementation cp --abi cp312 \
            --only-binary=:all: \
            -r image_builder/payload/hardware-requirements.txt dist/image-builder/*.whl
      - uses: actions/upload-artifact@v7
        env:
          NODE_OPTIONS: --use-openssl-ca
        with:
          name: synapse-wheelhouse
          path: dist/wheelhouse
          if-no-files-found: error

  cpython:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - name: Prepare audited TLS trust
        working-directory: ${{ github.workspace }}
        shell: bash
        run: python image_builder/payload/tls_policy.py bundle --output "$RUNNER_TEMP/synapse-ca.pem" --github-env

      - uses: actions/setup-python@v6
        env:
          NODE_OPTIONS: --use-openssl-ca
        with:
          check-latest: true
          python-version: '3.12'
      - name: Update and audit Python TLS tooling
        working-directory: ${{ github.workspace }}
        run: |
          python image_builder/payload/tls_policy.py bootstrap
          python image_builder/payload/tls_policy.py audit

      - uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/synapse-python-build/downloads
          key: synapse-cpython-${{ hashFiles('image_builder/sources.json') }}
          restore-keys: synapse-cpython-
      - name: Install host disk tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            parted gdisk e2fsprogs util-linux udev xz-utils
      # Every image target is Debian trixie arm64, so one build is shared by
      # all boards; payload/install.sh unpacks it instead of compiling.
      - name: Build shared CPython once
        run: |
          sudo -E bash image_builder/build-python.sh --board raspberrypi \
            --work-dir "$RUNNER_TEMP/synapse-python-build" \
            --output dist/synapse-python.tar.xz
      - uses: actions/upload-artifact@v7
        env:
          NODE_OPTIONS: --use-openssl-ca
        with:
          name: synapse-python
          path: dist/synapse-python.tar.xz
          if-no-files-found: error

  image:
    needs: [test, matrix, wheel, cpython]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        board: ${{ fromJSON(needs.matrix.outputs.boards) }}
    steps:
      - uses: actions/checkout@v6
      - name: Prepare audited TLS trust
        working-directory: ${{ github.workspace }}
        shell: bash
        run: python image_builder/payload/tls_policy.py bundle --output "$RUNNER_TEMP/synapse-ca.pem" --github-env

      - uses: actions/download-artifact@v8
        env:
          NODE_OPTIONS: --use-openssl-ca
        with:
          name: synapse-image-wheel
          path: dist/image-builder
      - uses: actions/download-artifact@v8
        env:
          NODE_OPTIONS: --use-openssl-ca
        with:
          name: synapse-python
          path: dist
      - uses: actions/download-artifact@v8
        env:
          NODE_OPTIONS: --use-openssl-ca
        with:
          name: synapse-wheelhouse
          path: dist/wheelhouse
      - name: Resolve selected base image cache key
        id: basekey
        env:
          BOARD: ${{ matrix.board }}
        run: |
          key=$(python3 -c 'import hashlib, json, os, subprocess; a = json.loads(subprocess.check_output(["python3", "-m", "image_builder.build", "resolve", "--board", os.environ["BOARD"]])); print(hashlib.sha256(a["file_url"].encode()).hexdigest())')
          echo "key=$key" >> "$GITHUB_OUTPUT"
      # The builder re-verifies SHA256 and the Armbian signature on every use,
      # so a cached download keyed by the official URL hash stays safe.
      - uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/synapse-image/downloads
          key: synapse-base-${{ steps.basekey.outputs.key }}
          restore-keys: synapse-base-
      - name: Install host disk tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            parted gdisk fdisk e2fsprogs dosfstools util-linux udev xz-utils gnupg
      - name: Build current supported Debian CLI minimal image
        env:
          BOARD: ${{ matrix.board }}
        run: |
          wheels=(dist/image-builder/*.whl)
          test "${#wheels[@]}" -eq 1
          python3 -m image_builder.build build --board "$BOARD" \
            --wheel "${wheels[0]}" --work-dir "$RUNNER_TEMP/synapse-image" \
            --python-tarball dist/synapse-python.tar.xz \
            --wheelhouse dist/wheelhouse \
            --output-dir dist/images
      - uses: actions/upload-artifact@v7
        env:
          NODE_OPTIONS: --use-openssl-ca
        with:
          name: synapse-${{ matrix.board }}
          path: dist/images/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Prepare audited TLS trust
        working-directory: ${{ github.workspace }}
        shell: bash
        run: python image_builder/payload/tls_policy.py bundle --output "$RUNNER_TEMP/synapse-ca.pem" --github-env

      - uses: actions/download-artifact@v8
        env:
          NODE_OPTIONS: --use-openssl-ca
        with:
          path: dist
          pattern: synapse-*
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          fail_on_unmatched_files: true
