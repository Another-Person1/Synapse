network:
  version: 2
  renderer: networkd
  ethernets:
    all-eth-interfaces:
      match:
        name: "e*"
      dhcp4: true
      dhcp6: true
      link-local: [ipv4, ipv6]
      optional: true
    synapse-usb-adapters:
      match:
        name: "usb*"
      dhcp4: true
      dhcp6: true
      link-local: [ipv4, ipv6]
      optional: true
